<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flight Log — Log In</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#0b1220">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Flight Log">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand">
        <div class="brand-title">Flight Log</div>
        <div class="brand-sub">Personal drone flight record — A2 CofC</div>
      </div>

      <div class="panel">
        <div class="field">
          <label>Email</label>
          <input id="email" type="email" autocomplete="username">
        </div>
        <div class="field">
          <label>Password</label>
          <input id="password" type="password" autocomplete="current-password">
        </div>
        <div class="error-msg" id="error"></div>
        <button class="btn" id="loginBtn" style="width:100%">Log In</button>
      </div>

      <div class="hint">Private log &middot; single-user access</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { firebaseConfig } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // If already logged in, skip straight to the app.
    onAuthStateChanged(auth, (user) => {
      if (user) window.location.href = "app.html";
    });

    const errorEl = document.getElementById("error");
    document.getElementById("loginBtn").addEventListener("click", async () => {
      errorEl.textContent = "";
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      if (!email || !password) {
        errorEl.textContent = "Enter your email and password.";
        return;
      }
      try {
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = "app.html";
      } catch (err) {
        errorEl.textContent = "Login failed — check your email and password.";
      }
    });

    // Allow Enter key to submit.
    document.getElementById("password").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("loginBtn").click();
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
  </script>
</body>
</html>
